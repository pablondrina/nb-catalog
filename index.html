    <template x-if="basketView && !basketItemQuantity()">
        <header
            class="top-0 fixed h-20 w-full grid grid-row-1 grid-cols-5 gap-2 items-center bg-amber-50 p-4 drop-shadow-md">
            <div class="grid justify-self-start">
                <button @click="switchView">
                    <p class="leading-none">Fechar</p>
                </button>
            </div>
            <div class="grid justify-self-center col-span-3">
                <h1 class="text-2xl"><strong>Sacola vazia</strong></h1>
            </div>
            <div class="grid justify-self-end">
            </div>
        </header>
    </template>


    <!-- Conteúdo do CATÁLOGO -->
    <template x-if="!basketView">
        <main class="py-20">
            <div>
                <img src="img/table.jpg" alt="Mesa de pães" class="h-48 w-full object-cover">
                <!-- <img src="img/logo/logotipo_ext_32px.svg" alt="Nelson Boulangerie" class="h-auto w-96"> -->
            </div>

            <section id="catalog" class="pt-2">
                <template x-for="product in products" :key="product.cod">
                    <div class="flex gap-3 px-4 sm:px-2 sm:rounded-xl py-2 hover:bg-amber-100">
                        <div
                            class="flex-none drop-shadow-lg place-self-center transform hover:-rotate-2 -translate-y-1/6">
                            <div class="vintage-photo-container ">
                                <div
                                    class="border-white border-8 ring-8 ring-white ring-inset outline-8 outline-white outline-offset-2">
                                    <img x-bind:src="product.image" alt="Imagem do produto"
                                        class="inline-block h-24 w-24"
                                        onerror="this.src='https://placehold.co/50?text=:)&font=lora';">
                                </div>
                            </div>
                        </div>
                        <div class="grow w-1/2 justify-between flex flex-col py-1">

                            <div class="w-full">
                                <p x-text="product.name" class="truncate leading-tight font-semibold">Nome do produto
                                </p>
                                <p x-text="product.description" class="truncate leading-none text-sm py-1">Descrição do
                                    produto</p>
                            </div>

                            <div class="h-8 flex flex-row items-center justify-between pb-1">
                                <p class="leading-none font-light">R$ <span x-text="product.price.toFixed(2)"></span>
                                </p>
                                <div class="flex flex-row items-center">
                                    <button @click="decrementQuantity(product)" x-show="product.quantity"
                                        class="text-3xl font-light bg-amber-100 hover:bg-stone-300 hover:text-stone-900 rounded-full h-10 w-10 pb-1">&minus;</button>
                                    <p x-show="product.quantity" x-text="product.quantity" class="p-3">9</p>
                                    <button @click="incrementQuantity(product)"
                                        class="text-3xl font-light bg-amber-100 hover:bg-stone-300 hover:text-stone-900 rounded-full h-10 w-10 pb-1">&plus;</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                </template>
            </section>

        </main>
    </template>


    <!-- Conteúdo da SACOLA -->
    <template x-if="basketView">
        <main class="py-24">
            <section id="basket" class="h-screen">

                <template x-if="!basketItemQuantity()">
                    <div class="h-1/2">
                        <div class="container-fluid pt-24 p-8 items-center text-center">
                            <div class="flex place-content-center py-4 text-stone-300">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="w-16 h-16">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                                </svg>
                            </div>

                            <h2 class="text-2xl text-center font-semibold py-2">Adicione itens a sua sacola</h2>
                            <p class="py-2 text-center font-thin text-stone-500">Selecione os itens do seu interesse e
                                nos
                                envie como uma mensagem. Use este recurso para tirar dúvidas sobre o processo de compra,
                                personalização, entrega e o que mais precisar.</p>
                        </div>

                        <footer
                            class="bottom-0 fixed h-20 w-full grid grid-row-1 grid-cols-5 gap-2 items-end bg-amber-50 p-4 drop-shadow-2xl">
                            <div class="container m-auto grid justify-self-center col-span-5 w-full">
                                <button @click="switchView"
                                    class="bg-amber-100 hover:bg-stone-300 hover:text-stone-900 rounded-lg p-2 w-full">
                                    Ver catálogo
                                </button>
                            </div>
                        </footer>

                    </div>

                </template>

                <template x-for="item in basket" :key="item.product.cod">
                    <div class="flex gap-3 px-4 sm:px-2 sm:rounded-xl py-2 hover:bg-amber-100">
                        <div class="flex-none w-16">
                            <img x-bind:src="item.product.image" alt="Imagem do produto"
                                class="inline-block h-16 w-16 rounded-lg"
                                onerror="this.src='https://placehold.co/50?text=:)&font=lora';">
                        </div>
                        <div class="grow w-2/3 justify-between flex flex-col">

                            <div class="w-full">
                                <p x-text="item.product.name" class="truncate leading-tight font-semibold">
                                    Nome do produto
                                </p>

                            </div>
                            <div class="flex flex-row justify-between items-center">

                                <div class="h-8 flex flex-row items-center">
                                    <button @click="decrementQuantity(item.product)"
                                        x-bind:disabled="item.product.quantity === 0"
                                        class="text-3xl font-light bg-amber-100 hover:bg-stone-300 hover:text-stone-900 rounded-full h-10 w-10 pb-1">&minus;</button>
                                    <p x-text="item.product.quantity" class="p-3">9</p>
                                    <button @click="incrementQuantity(item.product)"
                                        class="text-3xl font-light bg-amber-100 hover:bg-stone-300 hover:text-stone-900 rounded-full h-10 w-10 pb-1">&plus;</button>
                                </div>

                                <div class="h-8 flex flex-row items-center justify-end pb-1">
                                    <p class="leading-none font-light">R$ <span
                                            x-text="basketItemTotal(item).toFixed(2)"></span>
                                    </p>

                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                </template>
            </section>
        </main>
    </template>


    <!-- Rodapé do CATÁLOGO, com botão VER SACOLA -->
    <template x-if="!basketView && basketItemQuantity()">
        <footer
            class="bottom-0 fixed h-20 w-full grid grid-row-1 grid-cols-5 gap-2 items-end bg-amber-50 p-4 drop-shadow-2xl">
            <div class="container m-auto grid justify-self-center col-span-5 w-full">
                <button @click="switchView"
                    class="bg-amber-100 hover:bg-stone-300 hover:text-stone-900 rounded-lg p-2 w-full">
                    Ver sacola
                </button>
            </div>
        </footer>
    </template>


    <!-- Rodapé da SACOLA, com subtotal e botão ENVIAR PEDIDO -->
    <template x-if="basketView && basketItemQuantity()">
        <footer
            class="bottom-0 fixed h-auto w-full grid grid-row-1 grid-cols-5 gap-2 items-end bg-amber-50 p-4 drop-shadow-2xl">
            <div class="grid justify-self-center text-center col-span-5 w-full">
                <div class="pb-4">
                    <div class="flex flex-row justify-between items-center py-2">
                        <h2 class="text-2xl font-semibold">Subtotal</h2>
                        <h2 class="text-2xl font-light">R$ <span x-text="orderTotal().toFixed(2)"></span></h2>

                    </div>
                    <p class="font-thin text-stone-500 text-center">Vamos confirmar seu pedido e o valor total,
                        incluindo
                        possíveis taxas e descontos.</p>
                </div>
                <a role="button" x-bind:href="generateWhatsappMessageLink(basket)"
                    class="bg-emerald-600 text-white hover:bg-stone-300 hover:text-stone-900 rounded-lg p-2 w-full">Enviar
                    por WhatsApp</a>
            </div>
        </footer>
    </template>


    <script>

            return {
                products: [
                    { cod: 'bax', image: "img/products/bax.jpg", name: 'Italiano Rústico', description: 'Pão tradicional, só farinha, água e sal', price: 15.00, quantity: 0 },
                    { cod: 'fe', image: "img/products/fe.jpg", name: 'Fendu', description: 'Pãozinho francês com farinha orgânica e fermentação 100% natural', price: 3.50, quantity: 0 },
                    { cod: 'ph', image: "img/products/ph.jpg", name: 'Pão de Hambúrguer Rústico', description: '', price: 3.50, quantity: 0 },
                    { cod: 'ba', image: "img/products/ba.jpg", name: 'Bâtard', description: '', price: 9.00, quantity: 0 },

                incrementQuantity(product) {
                    product.quantity++;
                    const basketItem = this.basket.find(item => item.product === product);
                    if (!basketItem && product.quantity > 0) {
                        this.basket.push({ product: product, quantity: product.quantity });
                    } else if (basketItem) {
                        basketItem.quantity = product.quantity;
                    }
                },
                decrementQuantity(product) {
                    if (product.quantity > 0) {
                        product.quantity--;
                        const basketItem = this.basket.find(item => item.product === product);
                        if (basketItem) {
                            basketItem.quantity = product.quantity;
                            if (product.quantity === 0) {
                                const itemIndex = this.basket.indexOf(basketItem);
                                this.basket.splice(itemIndex, 1);
                            }
                        }
                    }
                },

                basketItemQuantity() {
                    return this.basket.reduce((total, item) => total + item.quantity, 0); // quando a soma for 0, retorna false
                },

                basketItemTotal(item) {
                    return item.product.price * item.quantity;
                },
                orderTotal() {
                    return this.basket.reduce((total, item) => total + (item.product.price * item.quantity), 0);
                },
                basketView: false,
                switchView() {
                    this.basketView = !this.basketView;
                },

                generateWhatsappMessageLink(basket) {
                    // Cria a mensagem de introdução
                    let message = 'Olá! Tenho interesse nos seguintes produtos:\n\n';

                    // Adiciona cada item da sacola na mensagem
                    basket.forEach(item => {
                        message += `${item.quantity} x *${item.product.name}* a R$ ${item.product.price?.toFixed(2) ?? 0} cada: R$ ${this.basketItemTotal(item).toFixed(2)}\n`; // Verifica se a propriedade price existe antes de usar toFixed
                    });

                    message += `—\n*Subtotal*: R$ ${this.orderTotal().toFixed(2)}`;

                    // Adiciona a linha de finalização
                    message += '\n\nAguardo resposta para finalizar o pedido.';

                    // Codifica a mensagem para o formato de link do WhatsApp
                    encodedMessage = encodeURIComponent(message);

                    recipientNumber = '554333231997';
                    whatsAppPrefix = 'https://wa.me/' + recipientNumber + '?text=';
                    messageLink = whatsAppPrefix + encodedMessage;

                    // Retorna o link completo do WhatsApp com a mensagem codificada
                    return messageLink;
                },
                formatCurrency(value) {
                    const currencyFormatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
                    return currencyFormatter.format(value);
                }
